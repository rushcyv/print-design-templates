name: Template Bot (AI Drafts)

on:
  workflow_dispatch:
    inputs:
      count_each:
        description: "How many drafts per product type"
        required: true
        default: "1"
      style:
        description: "Style (minimal, luxury, modern, playful, corporate)"
        required: true
        default: "minimal"
      color:
        description: "Color (dark, light, red, blue, green, pastel)"
        required: true
        default: "dark"
      industry:
        description: "Industry (restaurant, hotel, beauty, construction, general)"
        required: true
        default: "general"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate AI drafts (PNG + JSON + manifest)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUNT_EACH: ${{ github.event.inputs.count_each }}
          STYLE: ${{ github.event.inputs.style }}
          COLOR: ${{ github.event.inputs.color }}
          INDUSTRY: ${{ github.event.inputs.industry }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const OPENAI_API_KEY = process.env.OPENAI_API_KEY;
          if (!OPENAI_API_KEY) {
            console.error("OPENAI_API_KEY missing");
            process.exit(1);
          }

          const COUNT_EACH = parseInt(process.env.COUNT_EACH || "1", 10);
          const STYLE = process.env.STYLE;
          const COLOR = process.env.COLOR;
          const INDUSTRY = process.env.INDUSTRY;

          const OWNER = process.env.OWNER;
          const REPO = process.env.REPO;
          const BRANCH = process.env.BRANCH;
          const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

          const PREV_DIR = "drafts/previews";
          const TPL_DIR = "drafts/templates";
          fs.mkdirSync(PREV_DIR, { recursive: true });
          fs.mkdirSync(TPL_DIR, { recursive: true });

          const MANIFEST_PATH = "drafts/manifest.json";
          let manifest = { version: "1.0", templates: [] };
          if (fs.existsSync(MANIFEST_PATH)) {
            try {
              manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, "utf8"));
            } catch {}
          }

          const PRODUCTS = [
            { type: "business_card", size: "1024x1024" },
            { type: "flyer", size: "1024x1792" },
            { type: "rollup", size: "1024x1792" },
            { type: "booklet", size: "1024x1792" },
            { type: "poster", size: "1024x1792" }
          ];

          async function generateImage(prompt, size) {
            const res = await fetch("https://api.openai.com/v1/images/generations", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${OPENAI_API_KEY}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: "gpt-image-1",
                prompt,
                size
              })
            });

            if (!res.ok) {
              throw new Error(await res.text());
            }

            const data = await res.json();
            return Buffer.from(data.data[0].b64_json, "base64");
          }

          (async () => {
            for (const p of PRODUCTS) {
              for (let i = 0; i < COUNT_EACH; i++) {
                const id = `${p.type}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
                const pngPath = `${PREV_DIR}/${id}.png`;
                const tplPath = `${TPL_DIR}/${id}.json`;

                const prompt = `
                Print background for ${p.type}.
                Style: ${STYLE}, color theme: ${COLOR}, industry: ${INDUSTRY}.
                Clean, modern, professional.
                NO text, NO letters, NO numbers, NO logos.
                Leave empty areas for text and QR.
                `;

                console.log("Generating:", id);
                const png = await generateImage(prompt, p.size);
                fs.writeFileSync(pngPath, png);

                const tpl = {
                  canvas: { width: 100, height: 100, unit: "mm" },
                  tags: [STYLE, COLOR, INDUSTRY, "ai"],
                  layers: [
                    {
                      type: "image",
                      src: `${RAW_BASE}/${pngPath}`,
                      x: 0,
                      y: 0,
                      width: "100%",
                      height: "100%"
                    }
                  ]
                };

                fs.writeFileSync(tplPath, JSON.stringify(tpl, null, 2));

                manifest.templates.push({
                  id,
                  productType: p.type,
                  preview: `${RAW_BASE}/${pngPath}`,
                  templateUrl: `${RAW_BASE}/${tplPath}`,
                  createdAt: new Date().toISOString()
                });
              }
            }

            fs.writeFileSync(MANIFEST_PATH, JSON.stringify(manifest, null, 2));
          })().catch(e => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Commit & push drafts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add drafts
          git commit -m "add AI draft templates" || echo "nothing to commit"
          git push
