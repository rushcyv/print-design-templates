name: Template Bot

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Product type (business_card, rollup, booklet)"
        required: true
        default: "business_card"
      count:
        description: "How many drafts to generate"
        required: true
        default: "3"

# IMPORTANT: allow workflow to push commits
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate draft placeholder files
        env:
          INPUT_PRODUCT: ${{ github.event.inputs.product }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const product = process.env.INPUT_PRODUCT || "business_card";
          const count = parseInt(process.env.INPUT_COUNT || "3", 10);

          const dir = "drafts/previews";
          fs.mkdirSync(dir, { recursive: true });

          for (let i = 0; i < count; i++) {
            const id = `${product}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            const filePath = `${dir}/${id}.txt`;
            fs.writeFileSync(filePath, `DRAFT PLACEHOLDER\nproduct=${product}\nid=${id}\n`);
            console.log("Created:", filePath);
          }
          EOF

      - name: Commit drafts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add drafts
          git commit -m "add draft templates" || echo "nothing to commit"
          git push
