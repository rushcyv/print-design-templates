name: Template Bot

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Product type (business_card, rollup, booklet)"
        required: true
        default: "business_card"
      count:
        description: "How many drafts to generate"
        required: true
        default: "3"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Debug (branch/actor)
        run: |
          echo "actor=${{ github.actor }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "repository=${{ github.repository }}"

      - name: Ensure REPO_PAT secret exists
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "$REPO_PAT" ]; then
            echo "ERROR: REPO_PAT secret is EMPTY or not доступен."
            exit 1
          fi
          echo "REPO_PAT is present."

      - name: Generate draft placeholder files
        env:
          INPUT_PRODUCT: ${{ github.event.inputs.product }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const product = process.env.INPUT_PRODUCT || "business_card";
          const count = parseInt(process.env.INPUT_COUNT || "3", 10);

          const dir = "drafts/previews";
          fs.mkdirSync(dir, { recursive: true });

          for (let i = 0; i < count; i++) {
            const id = `${product}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
            const filePath = `${dir}/${id}.txt`;
            fs.writeFileSync(filePath, `DRAFT PLACEHOLDER\nproduct=${product}\nid=${id}\n`);
            console.log("Created:", filePath);
          }
          EOF

      - name: Commit & push with PAT
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "template-bot"
          git config user.email "bot@templates.ai"

          git add drafts
          git commit -m "add draft templates" || echo "nothing to commit"

          # Force origin to use PAT (NOT github-actions[bot])
          git remote set-url origin https://x-access-token:${REPO_PAT}@github.com/${{ github.repository }}.git

          # Push to the same branch that triggered the workflow
          git push origin HEAD:${{ github.ref_name }}
